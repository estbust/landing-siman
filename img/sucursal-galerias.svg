<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="bgGal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bgGal)"/>
  
  <!-- Architectural Facade of Mall Simán Galerías Escalón -->
  <!-- Ground -->
  <rect x="0" y="270" width="500" height="50" fill="#64748B"/>
  
  <!-- Main Building Structure -->
  <rect x="70" y="110" width="360" height="160" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Top Roofline / Parapet in Siman Red -->
  <rect x="60" y="90" width="380" height="25" fill="#D11927"/>
  <text x="250" y="108" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SIMAN GALERÍAS</text>

  <!-- Modern Glass Entrance and Windows -->
  <rect x="190" y="180" width="120" height="90" fill="#0284C7" fill-opacity="0.3" stroke="#0369A1" stroke-width="2"/>
  <line x1="250" y1="180" x2="250" y2="270" stroke="#0369A1" stroke-width="2"/>
  <!-- Windows -->
  <rect x="95" y="130" width="70" height="90" fill="#38BDF8" fill-opacity="0.4"/>
  <rect x="335" y="130" width="70" height="90" fill="#38BDF8" fill-opacity="0.4"/>
  
  <!-- Palm trees in front (Typical San Salvador tropical feel) -->
  <g transform="translate(420, 160)">
    <path d="M 15 110 Q 5 50 15 0" stroke="#78350F" stroke-width="5" fill="none"/>
    <path d="M 15 0 Q -25 -20 -35 15" stroke="#15803D" stroke-width="4" fill="none"/>
    <path d="M 15 0 Q 30 -30 50 0" stroke="#15803D" stroke-width="4" fill="none"/>
    <path d="M 15 0 Q 5 -35 0 -40" stroke="#16A34A" stroke-width="4" fill="none"/>
  </g>
  <g transform="translate(35, 170)">
    <path d="M 15 100 Q 25 50 15 0" stroke="#78350F" stroke-width="5" fill="none"/>
    <path d="M 15 0 Q -25 -20 -35 15" stroke="#15803D" stroke-width="4" fill="none"/>
    <path d="M 15 0 Q 30 -30 50 0" stroke="#15803D" stroke-width="4" fill="none"/>
  </g>

  <!-- Location Badge -->
  <rect x="20" y="20" width="220" height="32" rx="16" fill="#0F172A"/>
  <text x="130" y="41" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">📍 San Salvador • Casona</text>
</svg>
