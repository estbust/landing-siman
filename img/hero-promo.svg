<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F0916"/>
      <stop offset="45%" stop-color="#D11927"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#heroBg)"/>
  <circle cx="550" cy="250" r="280" fill="url(#glow)"/>

  <!-- Decorative geometric background patterns -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="2" fill="none">
    <polygon points="100,50 140,90 100,130 60,90"/>
    <polygon points="700,80 750,130 700,180 650,130"/>
    <polygon points="250,400 300,450 250,500 200,450"/>
    <polygon points="680,360 720,400 680,440 640,400"/>
    <circle cx="400" cy="100" r="60"/>
    <circle cx="150" cy="300" r="90"/>
  </g>

  <!-- Shopping Bags Composition (Visual Focal Point) -->
  <g transform="translate(440, 110)" filter="url(#softGlow)">
    <!-- Main Big Bag (Siman Red & White) -->
    <path d="M 60 140 L 260 140 L 240 330 L 80 330 Z" fill="#FFFFFF"/>
    <!-- Bag handles -->
    <path d="M 110 140 C 110 80, 210 80, 210 140" fill="none" stroke="#D11927" stroke-width="10" stroke-linecap="round"/>
    <!-- Logo on Bag -->
    <polygon points="160,195 180,215 160,235 140,215" fill="#D11927"/>
    <text x="160" y="260" font-family="'Montserrat', sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="#D11927" text-anchor="middle">SIMAN</text>

    <!-- Secondary Elegant Bag (Navy Blue & Gold) -->
    <path d="M 0 190 L 150 190 L 135 340 L 15 340 Z" fill="#0F172A"/>
    <path d="M 40 190 C 40 130, 110 130, 110 190" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round"/>
    <polygon points="75,235 90,250 75,265 60,250" fill="#D4AF37"/>
    <text x="75" y="285" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" letter-spacing="2" fill="#D4AF37" text-anchor="middle">VIP</text>

    <!-- Gift Box with Ribbon -->
    <g transform="translate(180, 230)">
      <rect x="0" y="30" width="110" height="80" rx="8" fill="#F8FAFC"/>
      <rect x="-5" y="15" width="120" height="22" rx="4" fill="#E2E8F0"/>
      <!-- Gold Ribbons -->
      <rect x="45" y="15" width="20" height="95" fill="url(#goldBanner)"/>
      <!-- Bow -->
      <path d="M 55 15 C 30 -10, 15 10, 55 15 Z" fill="#D4AF37"/>
      <path d="M 55 15 C 80 -10, 95 10, 55 15 Z" fill="#D4AF37"/>
      <circle cx="55" cy="15" r="7" fill="#FDE047"/>
    </g>
  </g>

  <!-- Left Side Text & Promo Highlights -->
  <g transform="translate(60, 110)">
    <!-- Floating Tag -->
    <rect x="0" y="0" width="210" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="15" y="23" font-family="'Montserrat', sans-serif" font-weight="700" font-size="13" fill="#FEF08A" letter-spacing="1.5">⚡ OFERTAS DE TEMPORADA</text>

    <!-- Huge Discount Headline -->
    <text x="0" y="80" font-family="'Montserrat', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">HASTA EL</text>
    <text x="0" y="155" font-family="'Montserrat', sans-serif" font-weight="900" font-size="88" fill="#FFDE59" filter="url(#softGlow)">50% OFF</text>
    <text x="0" y="200" font-family="'Poppins', sans-serif" font-weight="600" font-size="20" fill="#FFFFFF" opacity="0.95">+ Hasta 24 cuotas sin intereses con Credisiman</text>

    <!-- Country Pill -->
    <rect x="0" y="235" width="260" height="42" rx="21" fill="url(#goldBanner)"/>
    <text x="130" y="262" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#0F172A" text-anchor="middle" letter-spacing="1">🇸🇻 EXCLUSIVO EL SALVADOR</text>
  </g>
</svg>
