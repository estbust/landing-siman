<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="bgTechEv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bgTechEv)"/>

  <!-- Circuit grid pattern -->
  <g stroke="#10B981" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 50 160 H 200 L 250 210 H 450"/>
    <path d="M 100 80 H 220 L 260 120 H 400"/>
    <circle cx="200" cy="160" r="4" fill="#10B981"/>
    <circle cx="250" cy="210" r="4" fill="#10B981"/>
    <circle cx="220" cy="80" r="4" fill="#10B981"/>
    <circle cx="260" cy="120" r="4" fill="#10B981"/>
  </g>

  <!-- VR Headset & Controller Illustration -->
  <g transform="translate(160, 90)">
    <!-- VR Visor -->
    <rect x="20" y="30" width="140" height="70" rx="28" fill="#1E293B" stroke="url(#neonGlow)" stroke-width="4"/>
    <!-- Visor reflective front plate -->
    <path d="M 35 48 C 35 48, 80 40, 145 48 L 145 75 C 90 85, 35 75, 35 75 Z" fill="url(#neonGlow)" opacity="0.8"/>
    <!-- Head strap -->
    <path d="M 20 60 C -15 60, -15 30, 20 35" fill="none" stroke="#475569" stroke-width="8"/>
    <path d="M 160 60 C 195 60, 195 30, 160 35" fill="none" stroke="#475569" stroke-width="8"/>
  </g>

  <!-- Event Badge -->
  <rect x="25" y="25" width="130" height="30" rx="15" fill="#10B981"/>
  <text x="90" y="45" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">TECH EXPO 2026</text>

  <!-- Date Pill -->
  <rect x="360" y="25" width="115" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="417" y="45" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">28 OCTUBRE</text>
</svg>
