<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgModa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="modaShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#881337" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgModa)"/>
  
  <!-- Subtle pattern -->
  <circle cx="80" cy="60" r="40" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="340" cy="220" r="70" fill="#FFFFFF" opacity="0.2"/>
  
  <!-- Fashion Illustration: Stylish Trench Coat / Dress & Handbag -->
  <g transform="translate(140, 40)" filter="url(#modaShadow)">
    <!-- Elegant Dress / Outfit Silhouette -->
    <path d="M 40 40 Q 60 20 80 40 L 95 90 L 80 95 L 110 200 L 10 200 L 40 95 L 25 90 Z" fill="#881337"/>
    <!-- Belt -->
    <rect x="35" y="105" width="50" height="10" rx="3" fill="#D4AF37"/>
    <!-- Collar / Neckline -->
    <polygon points="50,40 60,70 70,40" fill="#FCE7F3"/>
    
    <!-- Designer Handbag next to it -->
    <g transform="translate(85, 120)">
      <path d="M 25 30 C 25 10 55 10 55 30" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <rect x="10" y="30" width="60" height="45" rx="8" fill="#1E293B"/>
      <polygon points="40,45 46,51 40,57 34,51" fill="#D4AF37"/>
      <line x1="10" y1="42" x2="70" y2="42" stroke="#D4AF37" stroke-width="2"/>
    </g>
    
    <!-- Sunglasses -->
    <g transform="translate(35, 15)">
      <rect x="0" y="0" width="22" height="14" rx="4" fill="#0F172A"/>
      <rect x="28" y="0" width="22" height="14" rx="4" fill="#0F172A"/>
      <line x1="22" y1="5" x2="28" y2="5" stroke="#D4AF37" stroke-width="2"/>
    </g>
  </g>

  <!-- Promo Badge -->
  <g transform="translate(20, 20)">
    <rect width="110" height="32" rx="16" fill="#D11927"/>
    <text x="55" y="21" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">40% OFF</text>
  </g>
  
  <!-- Category Title -->
  <text x="25" y="260" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#881337">Moda &amp; Tendencias</text>
  <text x="25" y="280" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#4C0519">Marcas exclusivas de mujer y hombre</text>
</svg>
