<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="bgRunway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="spotLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bgRunway)"/>
  
  <!-- Spotlights -->
  <polygon points="120,0 20,320 220,320" fill="url(#spotLight)"/>
  <polygon points="380,0 280,320 480,320" fill="url(#spotLight)"/>

  <!-- Runway Stage -->
  <polygon points="250,110 330,320 170,320" fill="#E2E8F0" opacity="0.9"/>
  <!-- Stage light dots -->
  <circle cx="185" cy="305" r="4" fill="#F59E0B"/>
  <circle cx="215" cy="305" r="4" fill="#F59E0B"/>
  <circle cx="250" cy="305" r="4" fill="#F59E0B"/>
  <circle cx="285" cy="305" r="4" fill="#F59E0B"/>
  <circle cx="315" cy="305" r="4" fill="#F59E0B"/>

  <!-- Fashion silhouette model on stage -->
  <g transform="translate(230, 80)">
    <circle cx="20" cy="18" r="8" fill="#FFFFFF"/>
    <!-- Dress silhouette -->
    <path d="M 12 30 L 28 30 L 38 120 L 2 120 Z" fill="#D11927"/>
    <path d="M 8 38 L -4 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 32 38 L 44 65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Event Badge -->
  <rect x="25" y="25" width="130" height="30" rx="15" fill="#D4AF37"/>
  <text x="90" y="45" font-family="'Montserrat', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">EVENTO EXCLUSIVO</text>

  <!-- Date Pill -->
  <rect x="360" y="25" width="115" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="417" y="45" font-family="'Poppins', sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">24 OCTUBRE</text>
</svg>
