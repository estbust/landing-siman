<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="bgGv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bgGv)"/>
  
  <rect x="0" y="270" width="500" height="50" fill="#475569"/>

  <!-- Store front La Gran Vía (Open Air Lifestyle Center) -->
  <rect x="50" y="100" width="400" height="170" fill="#0F172A"/>
  <!-- Elegant red marquee / canopy -->
  <path d="M 40 100 L 460 100 L 440 135 L 60 135 Z" fill="#D11927"/>
  <text x="250" y="124" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SIMAN LA GRAN VÍA</text>

  <!-- Large Glass display windows -->
  <rect x="80" y="150" width="95" height="120" fill="#38BDF8" fill-opacity="0.25" stroke="#94A3B8" stroke-width="2"/>
  <rect x="195" y="150" width="110" height="120" fill="#E2E8F0" fill-opacity="0.3" stroke="#94A3B8" stroke-width="2"/>
  <rect x="325" y="150" width="95" height="120" fill="#38BDF8" fill-opacity="0.25" stroke="#94A3B8" stroke-width="2"/>

  <!-- Warm outdoor bistro lights (La Gran Vía pedestrian ambiance) -->
  <path d="M 20 60 Q 250 100 480 60" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="100" cy="74" r="5" fill="#FEF08A"/>
  <circle cx="180" cy="81" r="5" fill="#FEF08A"/>
  <circle cx="250" cy="82" r="5" fill="#FEF08A"/>
  <circle cx="320" cy="81" r="5" fill="#FEF08A"/>
  <circle cx="400" cy="74" r="5" fill="#FEF08A"/>

  <!-- Location Badge -->
  <rect x="20" y="20" width="240" height="32" rx="16" fill="#0F172A"/>
  <text x="140" y="41" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">📍 Antiguo Cuscatlán • La Libertad</text>
</svg>
