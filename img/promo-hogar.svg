<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgHogar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="hogarShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgHogar)"/>
  
  <!-- Modern Living Room Armchair & Lamp -->
  <g transform="translate(100, 45)" filter="url(#hogarShadow)">
    <!-- Floor Lamp -->
    <path d="M 30 180 L 50 40 L 70 180" fill="none" stroke="#475569" stroke-width="4"/>
    <polygon points="35,45 65,45 75,15 25,15" fill="#D97706"/>
    <ellipse cx="50" cy="180" rx="25" ry="5" fill="#334155"/>

    <!-- Modern Designer Armchair -->
    <g transform="translate(70, 60)">
      <!-- Chair Backrest -->
      <path d="M 20 50 C 20 10 110 10 110 50 L 110 90 L 20 90 Z" fill="#1E293B"/>
      <!-- Soft Cushion -->
      <rect x="15" y="70" width="100" height="30" rx="15" fill="#D11927"/>
      <!-- Armrests -->
      <path d="M 5 60 C 5 45 25 45 25 80 L 25 90 L 5 90 Z" fill="#334155"/>
      <path d="M 125 60 C 125 45 105 45 105 80 L 105 90 L 125 90 Z" fill="#334155"/>
      <!-- Wooden Legs -->
      <line x1="25" y1="95" x2="10" y2="135" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
      <line x1="105" y1="95" x2="120" y2="135" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Potted Plant on side table -->
    <g transform="translate(180, 110)">
      <rect x="10" y="40" width="30" height="40" rx="4" fill="#E2E8F0"/>
      <!-- Plant leaves -->
      <path d="M 25 40 Q 15 15 35 10 Q 35 30 25 40 Z" fill="#15803D"/>
      <path d="M 25 40 Q 40 20 15 15 Q 18 32 25 40 Z" fill="#16A34A"/>
    </g>
  </g>

  <!-- Promo Badge -->
  <g transform="translate(20, 20)">
    <rect width="110" height="32" rx="16" fill="#D11927"/>
    <text x="55" y="21" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">50% OFF</text>
  </g>
  
  <!-- Category Title -->
  <text x="25" y="260" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#78350F">Hogar &amp; Muebles</text>
  <text x="25" y="280" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#451A03">Salas, comedores y decoración contemporánea</text>
</svg>
