<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgBelleza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="bellezaShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#581C87" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgBelleza)"/>
  
  <!-- Perfume Bottle & Cosmetics -->
  <g transform="translate(110, 45)" filter="url(#bellezaShadow)">
    <!-- Luxury Perfume Bottle -->
    <g transform="translate(40, 20)">
      <!-- Golden spray atomizer cap -->
      <rect x="40" y="20" width="24" height="25" rx="3" fill="url(#goldCap)"/>
      <rect x="45" y="10" width="14" height="10" rx="2" fill="url(#goldCap)"/>
      <!-- Glass Bottle -->
      <rect x="15" y="45" width="74" height="95" rx="10" fill="#FFFFFF" fill-opacity="0.85" stroke="#E9D5FF" stroke-width="2"/>
      <!-- Perfume liquid inside -->
      <rect x="22" y="70" width="60" height="62" rx="6" fill="#F472B6" fill-opacity="0.45"/>
      <!-- Label -->
      <rect x="25" y="75" width="54" height="30" rx="4" fill="#FFFFFF"/>
      <text x="52" y="93" font-family="'Montserrat', sans-serif" font-weight="800" font-size="8" fill="#581C87" text-anchor="middle" letter-spacing="1">PARFUM</text>
      <text x="52" y="101" font-family="'Poppins', sans-serif" font-size="5" fill="#9333EA" text-anchor="middle">SIMAN</text>
    </g>

    <!-- Lipstick -->
    <g transform="translate(130, 70)">
      <rect x="10" y="50" width="22" height="40" rx="3" fill="#1E293B"/>
      <rect x="12" y="32" width="18" height="18" fill="url(#goldCap)"/>
      <!-- Slanted red lipstick bullet -->
      <path d="M 13 32 L 29 32 L 29 15 L 13 25 Z" fill="#D11927"/>
    </g>

    <!-- Powder Compact -->
    <g transform="translate(0, 95)">
      <ellipse cx="25" cy="40" rx="28" ry="14" fill="#FDE047"/>
      <ellipse cx="25" cy="38" rx="24" ry="11" fill="#FBCFE8"/>
      <!-- Mirror flap tilted up -->
      <path d="M 0 38 Q 25 5 50 38" fill="none" stroke="#D4AF37" stroke-width="3"/>
    </g>
  </g>

  <!-- Promo Badge -->
  <g transform="translate(20, 20)">
    <rect width="110" height="32" rx="16" fill="#D11927"/>
    <text x="55" y="21" font-family="'Montserrat', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">3x2 / 30%</text>
  </g>
  
  <!-- Category Title -->
  <text x="25" y="260" font-family="'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#581C87">Belleza &amp; Fragancias</text>
  <text x="25" y="280" font-family="'Poppins', sans-serif" font-weight="500" font-size="12" fill="#3B0764">Perfumería fina, cosméticos y skincare</text>
</svg>
