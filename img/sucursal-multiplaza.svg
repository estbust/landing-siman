<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="bgMulti" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#bgMulti)"/>

  <rect x="0" y="270" width="500" height="50" fill="#334155"/>

  <!-- Multiplaza Mall Modern Curved Storefront -->
  <path d="M 50 110 Q 250 80 450 110 L 450 270 L 50 270 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- Red Band -->
  <path d="M 50 110 Q 250 80 450 110 L 450 140 Q 250 110 50 140 Z" fill="#D11927"/>
  <text x="250" y="132" font-family="'Montserrat', sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SIMAN MULTIPLAZA</text>

  <!-- Level 1 and Level 2 Windows -->
  <rect x="80" y="160" width="340" height="45" fill="#38BDF8" fill-opacity="0.3"/>
  <rect x="80" y="215" width="340" height="55" fill="#38BDF8" fill-opacity="0.4"/>

  <!-- Location Badge -->
  <rect x="20" y="20" width="250" height="32" rx="16" fill="#0F172A"/>
  <text x="145" y="41" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">📍 Multiplaza Panamericana</text>
</svg>
