<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="simanRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51937"/>
      <stop offset="100%" stop-color="#B80E24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Diamond Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Outer Diamond -->
    <polygon points="32,4 60,32 32,60 4,32" fill="url(#simanRedGrad)"/>
    <!-- Inner faceted lines -->
    <polygon points="32,14 50,32 32,50 14,32" fill="#FFFFFF" fill-opacity="0.25"/>
    <polygon points="32,20 44,32 32,44 20,32" fill="#FFFFFF" fill-opacity="0.4"/>
    <!-- Center Sparkle -->
    <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
  </g>
  <!-- Brand Text -->
  <text x="82" y="47" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#D11927">SIMAN</text>
  <text x="84" y="62" font-family="'Poppins', sans-serif" font-weight="500" font-size="9" letter-spacing="3.5" fill="#1E293B">EL SALVADOR</text>
</svg>
